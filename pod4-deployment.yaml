apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod4-app
  namespace: default
  labels:
    app: pod4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod4
  template:
    metadata:
      labels:
        app: pod4
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:edge
          args:
            - -nginx.scrape-uri=http://localhost:80/stub_status
          ports:
            - containerPort: 9113
      volumes:
        - name: nginx-config
          configMap:
            name: pod4-nginx-config
