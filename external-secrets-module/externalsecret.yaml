apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bank-app-secrets
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: bank-app-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: bank-app/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: bank-app/db-credentials
        property: password