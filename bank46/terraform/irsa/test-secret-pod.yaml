apiVersion: v1
kind: Pod
metadata:
  name: test-secret-reader
spec:
  serviceAccountName: bank46-secret-sa
  containers:
  - name: reader
    image: amazon/aws-cli:latest
    command: ["sh", "-c", "aws secretsmanager get-secret-value --secret-id bank46/test-secret --query SecretString --output text && sleep 3600"]
